services:
  - name: mabrix-backend
    type: web
    env: node
    plan: free
    buildCommand: yarn
    startCommand: npm run start
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: PORT
        value: 5000
      - key: JWT_SECRET
        value: CHANGE_ME
      - key: FRONTEND_URL
        value: https://mabrixel254.netlify.app
      - key: ADMIN_EMAIL
        value: ian@gmail.com
      - key: ADMIN_PASSWORD
        value: admin123
      - key: ADMIN_NAME
        value: Ian Mabruk
