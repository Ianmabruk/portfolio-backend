services:
  backend:
    type: web
    name: mabrix-backend
    env: node
    plan: free
    buildCommand: yarn
    startCommand: npm run start
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: PORT
        value: 5000
      - key: JWT_SECRET
        value: mabrix-super-secret-key-change-in-production
      - key: FRONTEND_URL
        value: https://mabricks.netlify.app
